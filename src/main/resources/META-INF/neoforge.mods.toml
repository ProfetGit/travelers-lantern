modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"

[[mods]]
modId = "beltlantern"
version = "${version}"
displayName = "${name}"
authors = "${author}"
displayURL = "${homepage}"
description = '''${description}'''
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "beltlantern.mixins.json"

[[dependencies.beltlantern]]
modId = "minecraft"
type = "required"
versionRange = "[${mc},${mc_next})"
ordering = "NONE"
side = "BOTH"
