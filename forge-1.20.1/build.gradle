// Forge 1.20.1 build of Traveler's Lantern. Forge 1.20.1 needs ForgeGradle 6 (the Stonecutter project has no ForgeGradle 6 target),
// so this is a small project of its own that compiles the 1.20.1 sources Stonecutter generated for the Fabric target
// (../versions/1.20.1-fabric) minus platform/fabric and platform/neoforge, plus its own platform/forge entry class.
// Forge 1.20.1 runs SRG names at runtime: a mixin refmap (the Mixin Gradle plugin) and reobfJar/reobfJarJar.
// Run it with JAVA_HOME=/usr/lib/jvm/java-17-openjdk and Gradle 8.14 (ForgeGradle 6 does not run on Gradle 9):
//   JAVA_HOME=/usr/lib/jvm/java-17-openjdk ~/.gradle/wrapper/dists/gradle-8.14.3-bin/*/gradle-8.14.3/bin/gradle build
// after `./gradlew :1.20.1-fabric:compileJava` in the parent so the generated sources are current (mt.py and
// tools/Backport/port.py do both).
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin'
}

def props = new Properties()
file('../gradle.properties').withInputStream { props.load(it) }
def modId = props['mod.id']
version = props['mod.version'] + '+1.20.1-forge'
group = props['mod.group']
base { archivesName = modId }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            args '--username', 'Builder'
            mods { travelers_lantern { source sourceSets.main } }
        }
    }
}

mixin {
    add sourceSets.main, "travelers_lantern.refmap.json"
    config "travelers_lantern.mixins.json"
}

repositories {
    mavenCentral()
}

// the root build compiles the Sodium/Iris stand-ins for Java 21: this one needs them as Java 17 class files
tasks.register('compatStubs17', JavaCompile) {
    source(fileTree('../dev/stubs'))
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('compat-stubs')
    options.release = 17
}

dependencies {
    compileOnly files(layout.buildDirectory.dir('compat-stubs')).builtBy('compatStubs17')
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

def generated = file('../versions/1.20.1-fabric/build/generated/legacy/main/java')
def prep = tasks.register('prepSources', Copy) {
    from generated
    exclude 'io/github/profetgit/travelerslantern/platform/fabric/**', 'io/github/profetgit/travelerslantern/platform/neoforge/**'
    into layout.buildDirectory.dir('src')
}
sourceSets.main.java.srcDirs = [layout.buildDirectory.dir('src'), file('src')]
tasks.named('compileJava') { dependsOn prep }
sourceSets.main.resources.srcDirs = [file('../src/main/resources')]

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    exclude 'fabric.mod.json', 'META-INF/neoforge.mods.toml'
    def p = [version: project.version.toString(), mc: '1.20.1', mc_next: '1.21', name: props['mod.name'],
             description: props['mod.description'], author: props['mod.author'], homepage: props['mod.homepage']]
    inputs.properties(p)
    inputs.file(buildFile)
    filesMatching('META-INF/mods.toml') { expand(p) }
    filesMatching('*.mixins.json') { filter { it.replace('JAVA_21', 'JAVA_17').replace('"required": true,', '"required": true,\n  "refmap": "travelers_lantern.refmap.json",') } }
    filesMatching('pack.mcmeta') {
        filter { line -> line.contains('"min_format"') ? '    "pack_format": 15' : (line.contains('"max_format"') ? null : line) }
    }
}

jar {
    from(rootProject.file('../LICENSE'))
    manifest { attributes 'MixinConfigs': 'travelers_lantern.mixins.json' }
    finalizedBy 'reobfJar'
}

tasks.named('jar') { finalizedBy 'reobfJar' }
tasks.register('publishForTests', Copy) {
    from layout.buildDirectory.dir('libs')
    include 'travelers_lantern-*+1.20.1-forge.jar'
    into file('../versions/1.20.1-forge/build/libs')
}
tasks.matching { it.name == 'reobfJar' }.configureEach { finalizedBy 'publishForTests' }
// NeoForge's 1.20.1 line (47.1.x) still loads Forge mods: the same jar is the NeoForge 1.20.1 build (mt.py boots it as the neoforge loader)
tasks.register('publishNeoForgeCopy', Copy) {
    from layout.buildDirectory.dir('libs')
    include 'travelers_lantern-*+1.20.1-forge.jar'
    rename { it.replace('1.20.1-forge', '1.20.1-neoforge') }
    into file('../versions/1.20.1-neoforge/build/libs')
}
tasks.named('publishForTests') { finalizedBy 'publishNeoForgeCopy' }
